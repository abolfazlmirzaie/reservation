name: salon-booking-app

services:
  web:
    build: .
    container_name: reservation_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: reservation_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    container_name: reservation_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  celery_worker:
    build: .
    container_name: reservation_celery_worker
    command: celery -A reservation worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    build: .
    container_name: reservation_celery_beat
    command: celery -A reservation beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend/my-front-project
      dockerfile: Dockerfile
    container_name: salon_frontend
    ports:
      - "3001:3000"
    volumes:
      - ../frontend/my-front-project:/app:delegated
      - frontend_node_modules:/app/node_modules
    env_file:
      - ../frontend/my-front-project/.env.local
    environment:

      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_INTERVAL: "250"
      WATCHPACK_POLLING_INTERVAL: "250"
      # برای اینکه بعضی وقتا رو ویندوز رویدادها گم نشن:
      WATCHPACK_FORCE_POLLING: "true"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next:
